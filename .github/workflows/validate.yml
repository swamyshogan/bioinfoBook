name: validate cheat sheets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script compiles
        run: python -m py_compile bioterminal.py
      - name: Every db/ file is valid
        run: NO_COLOR=1 python bioterminal.py validate
