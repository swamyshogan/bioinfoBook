name: Request a new tool
description: Ask for a cheat sheet for a bioinformatics tool that isn't in bioterminal yet.
title: "New tool: "
labels: ["new tool"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool name
      placeholder: bedtools
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage or docs
      placeholder: https://bedtools.readthedocs.io
  - type: textarea
    id: commands
    attributes:
      label: Commands you'd want in it
      description: Even a rough list helps — what do you always have to look up?
      placeholder: |
        - intersect two BED files, keep overlaps
        - merge overlapping intervals
        - coverage of a BAM over regions
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Want to write it?
      options:
        - label: I'd like to open a pull request with the JSON file myself (see CONTRIBUTING.md)
